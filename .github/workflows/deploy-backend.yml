name: Deploy Backend

on:
  push:
    branches:
      - main
      - deploy-backend
    paths:
      - 'server/**'
      - 'package.json'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint backend code
        run: |
          echo "Linting server code..."
